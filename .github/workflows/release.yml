name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: write # Needed to push version bump commits and tags
      pull-requests: write # Not strictly needed if not creating PRs
      id-token: write # Needed for provenance if publishing to NPM

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Git User
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Version and Publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Use npx to ensure the binary is resolved correctly
          npx changeset version
          
          # Check if there are any changes (version bumps happened)
          if [[ -n $(git status --porcelain) ]]; then
            echo "Changes detected, committing version bumps..."
            git add .
            git commit -m "chore(release): version packages [skip ci]"
            
            # Since 'Frontend is King', we use its version as the global release tag
            FRONTEND_VERSION=$(node -p "require('./apps/frontend/package.json').version")
            GLOBAL_TAG="v$FRONTEND_VERSION"
            
            # Create standard monorepo tags (e.g. @kryptofolio/frontend@1.15.11)
            npx changeset tag
            # Also create the global legacy tag to maintain release continuity
            git tag "$GLOBAL_TAG"
            
            # Push commits and all tags to main
            git push origin main --follow-tags
            
            # Create a GitHub Release attached to the global tag
            # We use --generate-notes to auto-populate the body with the commit history
            gh release create "$GLOBAL_TAG" \
              --title "v$FRONTEND_VERSION" \
              --generate-notes \
              --latest
            
            echo "✅ GitHub Release $GLOBAL_TAG successfully created!"
          else
            echo "No changesets found, nothing to version or publish."
          fi
