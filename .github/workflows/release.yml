name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to push version bump commits and tags
      pull-requests: write # Not strictly needed if not creating PRs, but good practice
      id-token: write # Needed for provenance if publishing to NPM

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history required
          fetch-depth: 0
          # Use a PAT if available to bypass branch protection for pushing version bumps directly
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Git User
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Version and Publish
        run: |
          # Run changeset version to consume changesets and bump package versions
          pnpm changeset version
          
          # Check if there are any changes (version bumps happened)
          if [[ -n $(git status --porcelain) ]]; then
            echo "Changes detected, committing version bumps..."
            git add .
            git commit -m "chore(release): version packages [skip ci]"
            git push origin main
            
            # Publish packages
            # Note: We skip the NPM registry for now, or publish if needed.
            # Usually, you'd do: pnpm changeset publish
            # If packages are private/restricted, they might not publish to npm registry unless configured.
            pnpm changeset publish
          else
            echo "No changesets found, nothing to version or publish."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
